<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loja | LADO A Semijoias</title><meta name="description" content="Descubra a coleção LADO A de semijoias.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--ink:#2b2721;--muted:#786e62;--gold:#9a7d45;--line:#ded6c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px Jost,sans-serif}a{color:inherit}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px max(5vw,20px);border-bottom:1px solid var(--line);position:sticky;top:0;background:#f7f4eeed;backdrop-filter:blur(15px);z-index:5}.logo{font:500 31px 'Cormorant Garamond',serif;letter-spacing:.2em;text-decoration:none}.logo b{color:var(--gold)}.nav{display:flex;gap:25px;align-items:center}.nav a{text-decoration:none}.cart-button,.button{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 19px}.cart-button:hover,.button:hover{background:var(--gold);border-color:var(--gold)}main{max-width:1400px;padding:40px 25px 100px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400}h1{font-size:clamp(45px,7vw,84px);margin:4px 0 10px}p{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:12px;margin:35px 0 24px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;padding:12px;min-width:180px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.product{min-width:0}.picture{aspect-ratio:4/5;background:#ebe5dc;display:grid;place-items:center;overflow:hidden}.picture img{width:100%;height:100%;object-fit:cover}.placeholder{font:42px 'Cormorant Garamond',serif;color:#a79a85}.product h2{font-size:26px;margin:12px 0 2px}.product .price{color:var(--ink);font-weight:500}.product button{width:100%;margin-top:12px;background:transparent;border:1px solid var(--gold);padding:11px}.product button:hover{background:var(--ink);color:#fff}.notice{padding:24px;background:#efe9de;border-left:2px solid var(--gold);margin:30px 0;line-height:1.7}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--bg);z-index:20;transform:translateX(105%);transition:.3s;box-shadow:-20px 0 50px #0002;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 25px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:33px}.drawer-head button{background:none;border:none;font-size:28px}.lines{padding:20px 25px;overflow:auto;flex:1}.line{display:flex;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.line img{width:75px;height:90px;object-fit:cover}.line-details{flex:1}.line-actions{display:flex;align-items:center;gap:15px;margin-top:12px}.line-actions button{background:transparent;border:1px solid var(--line);width:31px;height:31px}.drawer-foot{padding:22px 25px;border-top:1px solid var(--line)}.drawer-foot .button{width:100%;margin-top:14px}.veil{position:fixed;inset:0;background:#0006;z-index:10;display:none}.veil.open{display:block}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}@media(max-width:1000px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.nav>a{display:none}header{padding:14px 18px}main{padding:34px 17px 60px}.product h2{font-size:21px}.toolbar input,.toolbar select{flex:1;min-width:130px}}
</style></head><body>
<header><a class="logo" href="index.html" aria-label="LADO A página inicial">LADO <b>A</b></a><nav class="nav"><a href="index.html">Nossa história</a><a href="index.html#vip">Grupo VIP</a><button class="cart-button" id="openCart">Sacola (<span id="cartCount">0</span>)</button></nav></header>
<main><div class="eyebrow">LADO A · seleção especial</div><h1>Peças que revelam o seu lado A.</h1><p>Uma curadoria de semijoias para acompanhar todos os seus momentos.</p>
<div id="status" role="status" aria-live="polite"></div>
<div class="toolbar"><label><span class="sr">Buscar semijoias</span><input id="search" type="search" placeholder="Buscar semijoias…"></label><label><span class="sr">Ordenar produtos</span><select id="sort"><option value="featured">Destaques</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option><option value="name">Nome A–Z</option></select></label></div>
<section class="products" id="products" aria-label="Produtos"></section></main>
<div id="veil" class="veil"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Sacola de compras" aria-hidden="true"><div class="drawer-head"><h2>Sua sacola</h2><button id="closeCart" aria-label="Fechar sacola">×</button></div><div id="lines" class="lines"></div><div class="drawer-foot"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><strong id="total">R$ 0,00</strong></div><p>Frete calculado no checkout.</p><button class="button" id="checkout">Finalizar compra com segurança</button></div></aside>
<script>
/* Configure um token PÚBLICO da Storefront API, nunca uma credencial Admin. */
const CONFIG={domain:'xsc9cb-iv.myshopify.com',publicStorefrontToken:'',apiVersion:'2026-10'};
const state={products:[],cart:null,cartId:sessionStorage.getItem('ladoA_cart_id')||null};
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s){$('#status').innerHTML='<div class="notice">'+esc(s)+'</div>'}
async function api(query,variables={}){const res=await fetch('https://'+CONFIG.domain+'/api/'+CONFIG.apiVersion+'/graphql.json',{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Storefront-Access-Token':CONFIG.publicStorefrontToken},body:JSON.stringify({query,variables})});if(!res.ok)throw Error('Falha ao conectar à Shopify.');const out=await res.json();if(out.errors?.length)throw Error(out.errors.map(x=>x.message).join('; '));return out.data}
const PRODUCT_QUERY=`query {products(first:80){nodes{id title handle description featuredImage{url altText} variants(first:30){nodes{id title availableForSale price{amount currencyCode}}}}}}`;
const CART_FIELDS=`id checkoutUrl lines(first:100){nodes{id quantity merchandise{... on ProductVariant{id title price{amount currencyCode} product{title featuredImage{url altText}}}}}} cost{subtotalAmount{amount currencyCode}}`;
async function load(){if(!CONFIG.publicStorefrontToken){message('A loja está preparada para a integração. Configure o token público da Storefront API e publique seus produtos na Shopify para habilitar catálogo e compras.');return}try{const d=await api(PRODUCT_QUERY);state.products=d.products.nodes.filter(p=>p.variants.nodes.some(v=>v.availableForSale));render();if(state.cartId){try{const c=await api(`query($id:ID!){cart(id:$id){${CART_FIELDS}}}`,{id:state.cartId});state.cart=c.cart;drawCart()}catch(e){state.cartId=null;sessionStorage.removeItem('ladoA_cart_id')}}}catch(e){message(e.message)}}
function render(){const term=$('#search').value.toLocaleLowerCase('pt-BR');let list=state.products.filter(p=>p.title.toLocaleLowerCase('pt-BR').includes(term));const sort=$('#sort').value;const price=p=>Number(p.variants.nodes.find(v=>v.availableForSale).price.amount);if(sort==='asc')list.sort((a,b)=>price(a)-price(b));if(sort==='desc')list.sort((a,b)=>price(b)-price(a));if(sort==='name')list.sort((a,b)=>a.title.localeCompare(b.title));$('#products').innerHTML=list.map(p=>{const v=p.variants.nodes.find(x=>x.availableForSale);return `<article class="product"><div class="picture">${p.featuredImage?'<img loading="lazy" src="'+esc(p.featuredImage.url)+'" alt="'+esc(p.featuredImage.altText||p.title)+'">':'<span class="placeholder">LADO A</span>'}</div><h2>${esc(p.title)}</h2><div class="price">${money(v.price.amount)}</div><label><span class="sr">Opção de ${esc(p.title)}</span><select aria-label="Escolha a opção" data-variant="${esc(p.id)}">${p.variants.nodes.filter(x=>x.availableForSale).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title)+'</option>').join('')}</select></label><button data-add="${esc(p.id)}">Adicionar à sacola</button></article>`}).join('');if(!list.length)message('Nenhuma peça disponível neste momento.');else $('#status').innerHTML=''}
async function add(id,variant){const lines=[{merchandiseId:variant,quantity:1}];try{let d;if(state.cartId){d=await api(`mutation($id:ID!,$lines:[CartLineInput!]!){cartLinesAdd(cartId:$id,lines:$lines){cart{${CART_FIELDS}} userErrors{message}}}`,{id:state.cartId,lines});if(d.cartLinesAdd.userErrors.length)throw Error(d.cartLinesAdd.userErrors[0].message);state.cart=d.cartLinesAdd.cart}else{d=await api(`mutation($input:CartInput!){cartCreate(input:$input){cart{${CART_FIELDS}} userErrors{message}}}`,{input:{lines}});if(d.cartCreate.userErrors.length)throw Error(d.cartCreate.userErrors[0].message);state.cart=d.cartCreate.cart}state.cartId=state.cart.id;sessionStorage.setItem('ladoA_cart_id',state.cartId);drawCart();toggle(true)}catch(e){message(e.message)}}
async function change(id,quantity){try{const d=await api(`mutation($id:ID!,$lines:[CartLineUpdateInput!]!){cartLinesUpdate(cartId:$id,lines:$lines){cart{${CART_FIELDS}} userErrors{message}}}`,{id:state.cartId,lines:[{id,quantity:Math.max(0,quantity)}]});if(d.cartLinesUpdate.userErrors.length)throw Error(d.cartLinesUpdate.userErrors[0].message);state.cart=d.cartLinesUpdate.cart;drawCart()}catch(e){alert(e.message)}}
function drawCart(){const ls=state.cart?.lines.nodes||[];$('#cartCount').textContent=ls.reduce((n,l)=>n+l.quantity,0);$('#total').textContent=money(state.cart?.cost.subtotalAmount.amount);$('#lines').innerHTML=ls.length?ls.map(l=>`<div class="line">${l.merchandise.product.featuredImage?'<img src="'+esc(l.merchandise.product.featuredImage.url)+'" alt="">':''}<div class="line-details"><strong>${esc(l.merchandise.product.title)}</strong><div>${esc(l.merchandise.title)}</div><div>${money(l.merchandise.price.amount)}</div><div class="line-actions"><button data-change="${esc(l.id)}" data-qty="${l.quantity-1}" aria-label="Diminuir">−</button><span>${l.quantity}</span><button data-change="${esc(l.id)}" data-qty="${l.quantity+1}" aria-label="Aumentar">+</button></div></div></div>`).join(''):'<p>Sua sacola está vazia.</p>';$('#checkout').disabled=!ls.length}
function toggle(open){$('#drawer').classList.toggle('open',open);$('#veil').classList.toggle('open',open);$('#drawer').setAttribute('aria-hidden',String(!open));document.body.style.overflow=open?'hidden':'';if(open)$('#closeCart').focus();else $('#openCart').focus()}
$('#products').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const id=b.dataset.add;const select=[...document.querySelectorAll('[data-variant]')].find(x=>x.dataset.variant===id);if(select)add(id,select.value)});$('#lines').addEventListener('click',e=>{const b=e.target.closest('[data-change]');if(b)change(b.dataset.change,Number(b.dataset.qty))});$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);$('#openCart').onclick=()=>toggle(true);$('#closeCart').onclick=()=>toggle(false);$('#veil').onclick=()=>toggle(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});$('#checkout').onclick=()=>{const u=state.cart?.checkoutUrl;if(u&&/^https:\/\//.test(u))location.href=u};load();
</script></body></html>
